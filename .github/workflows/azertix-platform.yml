name: Azertix platform
on:
  pull_request:
    paths: ['platform/**', 'deploy/vps/**', 'src/server/**', '.github/workflows/azertix-platform.yml']
  push:
    branches: [main]
    paths: ['platform/**', 'deploy/vps/**']
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: platform
      - run: npm test
        working-directory: platform
      - run: node --check platform/server.mjs && node --check platform/bot.mjs && node --check platform/public/app.js
      - run: for script in deploy/vps/*.sh; do bash -n "$script"; done
      - run: RELEASE_SHA=$(git rev-parse HEAD) docker compose --env-file deploy/vps/.env.ci --file deploy/vps/compose.yml config --quiet
